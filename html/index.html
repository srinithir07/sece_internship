<!DOCTYPE html>
<html>

<head>
    <title>Image Table</title>
</head>

<body>
    <center>
        <h1>Image Table</h1>
        <p>This is a simple image table.</p>
        <table border="1" cellpadding="10">
            <tr>
                <td>
                    <img src="images/python.svg" width="150" height="100" alt="Python">
                </td>
                <td>
                    <img src="images/java.svg" width="150" height="100" alt="Java">
                </td>
            </tr>

            <tr>
                <td>
                    <img src="images/html5.svg" width="150" height="100" alt="HTML5">
                </td>
                <td>
                    <img src="images/javascript.svg" width="150" height="100" alt="JavaScript">
                </td>
            </tr>
        </table>

        <script src="script.js"></script>
    </center>
</body>

</html>
